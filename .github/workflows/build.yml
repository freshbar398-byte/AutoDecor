name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64
            ndk: "27.0.12077973"
          - name: Android32
            os: ubuntu-latest
            target: Android32
            ndk: "27.0.12077973"
          - name: Windows
            os: windows-latest
            target: Win64
            ndk: ""

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          android-ndk-version: ${{ matrix.config.ndk }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: AutoDecor
          path: ${{ steps.build.outputs.build-output }}
